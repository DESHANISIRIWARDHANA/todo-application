<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TaskFlow - a fast, responsive todo list with filters and offline storage."
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>TaskFlow - Todo List</title>
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1>TaskFlow</h1>
        <p class="app__tagline">Plan the day. One task at a time.</p>
      </header>

      <form id="task-form" class="composer" autocomplete="off">
        <label class="visually-hidden" for="task-input">New task</label>
        <input
          id="task-input"
          name="task"
          class="composer__input"
          type="text"
          placeholder="What needs doing?"
          maxlength="200"
          required
        />
        <button type="submit" class="composer__add">Add</button>
      </form>

      <section class="panel" aria-label="Task list">
        <div id="filters" class="filters" role="group" aria-label="Filter tasks">
          <button type="button" data-filter="all" class="is-active" aria-pressed="true">All</button>
          <button type="button" data-filter="active" aria-pressed="false">Active</button>
          <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>

        <ul id="task-list" class="task-list"></ul>

        <p id="empty-state" class="empty-state" hidden>Nothing here yet — add your first task.</p>

        <footer class="panel__footer">
          <span id="task-count" class="task-count">0 tasks left</span>
          <button id="clear-completed" type="button" class="link-btn">Clear completed</button>
        </footer>
      </section>
    </main>

    <script type="module" src="./scripts/main.js"></script>
  </body>
</html>
